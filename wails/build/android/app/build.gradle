plugins {
    id 'com.android.application'
}

// The app version lives in build/config.yml, the same file wails3 feeds to the
// Windows resources and the NSIS installer. Reading it here keeps the APK from
// drifting when only the Windows side is bumped.
def readAppVersion() {
    def config = new File(projectDir, '../../config.yml')
    def inInfo = false
    for (line in config.readLines('UTF-8')) {
        def trimmed = line.trim()
        if (trimmed.isEmpty() || trimmed.startsWith('#')) {
            continue
        }
        if (!inInfo) {
            inInfo = trimmed == 'info:'
            continue
        }
        if (!line.startsWith(' ')) {
            break
        }
        def matcher = trimmed =~ /^version:\s*"([^"]+)"\s*(#.*)?$/
        if (matcher.find()) {
            return matcher.group(1)
        }
    }
    throw new GradleException("no info.version in ${config}")
}

def appVersion = readAppVersion()
def versionParts = appVersion.tokenize('.')
if (versionParts.size() != 3 || !versionParts.every { it ==~ /\d+/ }) {
    throw new GradleException(
            "info.version in build/config.yml must be MAJOR.MINOR.PATCH, got '${appVersion}'")
}
// versionCode must only ever grow: MAJOR.MINOR.PATCH maps to
// MAJOR * 10000 + MINOR * 100 + PATCH, so 1.0.0 becomes 10000.
def appVersionCode = versionParts[0].toInteger() * 10000 +
        versionParts[1].toInteger() * 100 +
        versionParts[2].toInteger()

android {
    // The Java sources must stay in com.wails.app: wails v3 hardcodes the JNI
    // export names (Java_com_wails_app_WailsBridge_*) in its Go library, so a
    // different package makes nativeInit fail with UnsatisfiedLinkError.
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.riyu.recitebook"
        minSdk 21
        targetSdk 35
        versionCode appVersionCode
        versionName appVersion

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        // A real keystore can be provided via environment variables; without
        // one, release builds are signed with the debug keystore so they can
        // be installed for testing (not suitable for Play Store uploads).
        release {
            if (hasKeystore) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    // AGP 8.7.3's lint parses the JVM version with IntelliJ's JavaVersion,
    // which throws IllegalArgumentException on JBR's four-part version string
    // ("25.0.4.1"), failing lintVitalAnalyzeRelease before it analyzes
    // anything. Re-enable once the Gradle JVM reports a three-part version
    // (JDK 17-21) or AGP is upgraded.
    lint {
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Packaging options
    packagingOptions {
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
