# revive configuration: a pragmatic ruleset for an application (not a library).
#
# `exported` and `package-comments` are deliberately absent. ReciteBook is a
# single-binary Wails app whose packages are all `main`/`internal`, so a doc
# comment on every exported identifier would only add noise without helping any
# downstream consumer.
#
# `build/` is excluded from linting on purpose: it holds the Wails-generated
# per-platform scaffolding and build-time helper scripts (iOS-only build tags,
# Android Gradle glue). They are template output, not application code, and are
# regenerated by `wails3`, so hand-editing them to satisfy the linter would be
# lost work. `gofumpt` still formats them, since formatting is idempotent.
#
# Run with: go tool revive -config revive.toml ./internal/... .

enableAllRules = false

[rule.blank-imports]
[rule.context-as-argument]
[rule.context-keys-type]
[rule.dot-imports]
[rule.empty-block]
[rule.error-naming]
[rule.error-return]
[rule.error-strings]
[rule.errorf]
[rule.increment-decrement]
[rule.indent-error-flow]
[rule.range]
[rule.receiver-naming]
[rule.redefines-builtin-id]
[rule.superfluous-else]
[rule.time-naming]
[rule.unexported-return]
[rule.unreachable-code]
[rule.unused-parameter]
[rule.var-declaration]
[rule.var-naming]
