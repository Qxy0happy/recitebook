name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.15.0"
  WAILS_VERSION: "v3.0.0-beta.34"
  GO_TASK_VERSION: "v3.54.0"
  VITE_PLUS_VERSION: "1.4.0"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: wails/frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: wails/frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: wails/frontend
        run: pnpm exec tsc --noEmit
      - name: Build
        working-directory: wails/frontend
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: wails/frontend/dist
          retention-days: 1
          if-no-files-found: error

  go:
    name: Go (vet, lint, test)
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum
      # The root package embeds frontend/dist; reuse the frontend job's build
      # instead of requiring vp on this runner.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: wails/frontend/dist
      - name: Vet
        working-directory: wails
        run: go vet . ./internal/...
      - name: Lint
        working-directory: wails
        run: go tool revive -set_exit_status -config revive.toml ./internal/... .
      - name: Test
        working-directory: wails
        run: go test -count=1 . ./internal/...

  data:
    name: Data baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Assert baseline counts
        shell: bash
        run: |
          set -euo pipefail
          dict=高频词/outputs/highfreq_dict.json
          qc=高频词/outputs/qc_report.json
          fail=0
          check() {
            if [ "$1" != "$2" ]; then
              echo "::error::$3: got $1, want $2"
              fail=1
            fi
          }
          check "$(jq '.words|length' "$dict")" 1452 "总词条"
          check "$(jq '[.words[]|select(.spelling==null)]|length' "$dict")" 181 "无词头"
          check "$(jq '[.words[]|select(.spelling!=null)|.spelling]|unique|length' "$dict")" 1251 "唯一拼写"
          check "$(jq '[.words[]|select(.list_no==null)]|length' "$dict")" 27 "list_no 为 null"
          check "$(jq -r '.themes' "$qc")" 8 "主题"
          check "$(jq -r '.total_lists' "$qc")" 92 "List"
          check "$(jq -r '.total_words' "$qc")" 1452 "QC 词条"
          check "$(jq -r '.warning_kinds.no_headword' "$qc")" 181 "no_headword"
          check "$(jq -r '.warning_kinds.ordinal_no_meaning' "$qc")" 27 "ordinal_no_meaning"
          check "$(jq -r '.warning_kinds.list_title_missing' "$qc")" 1 "list_title_missing"
          check "$(ls -d 考点词/outputs/List* | wc -l | tr -d ' ')" 29 "考点词册数"
          check "$(jq -s '[.[].lists[]]|length' 高频词/outputs/json/*.json)" 92 "主题文件 List 数"
          check "$(jq -s '[.[].lists[].words[]]|length' 高频词/outputs/json/*.json)" 1452 "主题文件词条"
          check "$(jq -s '[.[].lists[]|select(.words|length==0)]|length' 高频词/outputs/json/*.json)" 10 "空 List"
          check "$(jq -s 'map(.pages|length)|add' 考点词/outputs/List*/structured_content.json)" 258 "考点词页数"
          check "$(bun -e "const fs=require('fs'),p=require('path');let n=0;for(const d of ['考点词/outputs','高频词/outputs'])for(const e of fs.readdirSync(d)){const f=p.join(d,e,'markdown.md');if(fs.existsSync(f))n+=(fs.readFileSync(f,'utf8').match(/!\[\]\(images\//g)||[]).length}console.log(n)")" 986 "悬空图片引用"
          exit $fail

  android:
    name: Android (debug APK, release APK on tag)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: wails/frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools ndk;${{ env.ANDROID_NDK_VERSION }}"
      - name: Pin NDK
        run: Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_NDK_HOME=${env:ANDROID_HOME}\ndk\${{ env.ANDROID_NDK_VERSION }}"
      # The Taskfile drives the frontend through vp and needs task/wails3 on PATH.
      - name: Install Go tooling
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.GO_TASK_VERSION }}
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"
      - name: Install vite-plus
        run: npm install --global vite-plus@${{ env.VITE_PLUS_VERSION }}
      # go-task runs the Taskfile's `sh:` snippets; Windows runners only ship
      # Git's sh outside the default PATH.
      - name: Expose sh.exe
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('wails/build/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: wails
        run: |
          task android:build ARCH=arm64
          task android:assemble:apk
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: wails
        run: task android:package:fat
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: wails/bin/recitebook.apk
          if-no-files-found: error

  desktop:
    name: Windows desktop (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod
          cache-dependency-path: wails/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: wails/frontend/pnpm-lock.yaml
      - name: Install Go tooling
        run: |
          go install github.com/go-task/task/v3/cmd/task@${{ env.GO_TASK_VERSION }}
          go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$(go env GOPATH)\bin"
      - name: Install vite-plus
        run: npm install --global vite-plus@${{ env.VITE_PLUS_VERSION }}
      - name: Expose sh.exe
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\usr\bin"
      - name: Build exe
        working-directory: wails
        run: task windows:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: wails/bin/recitebook.exe
          if-no-files-found: error

  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/recitebook.apk "dist/recitebook-${GITHUB_REF_NAME}.apk"
          mv dist/recitebook.exe "dist/recitebook-${GITHUB_REF_NAME}.exe"
          gh release create "$GITHUB_REF_NAME" dist/recitebook-"${GITHUB_REF_NAME}".{apk,exe} \
            --title "循环背诵 $GITHUB_REF_NAME" --generate-notes
